plugins {
    id 'com.android.application'
}

android {
    namespace 'site.prohms.app'
    compileSdk 34

    defaultConfig {
        applicationId "site.prohms.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('pro-hms-release.keystore')
            storePassword 'ProHMS2024!'
            keyAlias 'pro-hms-key'
            keyPassword 'ProHMS2024!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
